name: Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --verbose --unreleased --prepend CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          set +e
          git add CHANGELOG.md
          output=$(git commit -m "chore(release): update CHANGELOG.md for ${{ github.ref_name }} [skip ci]")
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            git push
          else
            echo "$output"
            echo "No new entries to add to the changelog."
          fi
