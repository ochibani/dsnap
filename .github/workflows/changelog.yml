name: Changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Verify tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag ${TAG} is not contained in main; refusing to update CHANGELOG.md."
            exit 1
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog is already up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${TAG} [skip ci]"
          git push origin HEAD:main
