# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# Static header. The workflow regenerates CHANGELOG.md from scratch, so the
# header must live here instead of only in CHANGELOG.md.
header = """
# Changelog

All notable changes to this project are documented in this file.

This file is generated from conventional commit subjects.
"""

# No releases or tags are used, so the changelog has one rolling section.
body = """
## Changes

{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}

{% for commit in entry.commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""

# Remove leading and trailing whitespaces from the changelog's body.
trim = true

# Render the body even when there are no matching commits.
render_always = true

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true

# Ignore commits that are not conventional commits.
filter_unconventional = true

# Do not require every commit in history to be conventional.
require_conventional = false

# Treat each commit as one commit message.
split_commits = false

# Only include commits matched by the parsers below.
filter_commits = false

# Do not preserve skipped commits because of breaking-change markers.
protect_breaking_commits = false

# Only use tags from the current branch.
use_branch_tags = false

# Do not order releases topologically.
topo_order = false

# Keep commit ordering deterministic.
topo_order_commits = true
sort_commits = "oldest"

# Do not walk submodule history.
recurse_submodules = false

# No commit rewriting.
commit_preprocessors = []

# No issue/PR link rewriting.
link_parsers = []

# Include only important changes and skip noisy maintenance commits.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactor" },

    # Security work can be surfaced by scope or body text.
    { scope = "security", group = "<!-- 4 -->Security" },
    { body = "(?i)security", group = "<!-- 4 -->Security" },

    # Skip generated changelog commits and routine maintenance.
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^ci|^style|^test|^docs", skip = true },

    # Everything else is intentionally omitted.
    { message = ".*", skip = true },
]
